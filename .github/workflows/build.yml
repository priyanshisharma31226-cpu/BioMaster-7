name: Build BioMaster-7 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build information
        run: |
          echo "BioMaster-7 Android build started"
          ls -la

      - name: Save website files
        uses: actions/upload-artifact@v4
        with:
          name: BioMaster-7-website
          path: .
